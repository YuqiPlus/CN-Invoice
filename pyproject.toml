[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cninvoice"
version = "0.1.0a11"
description = "Local-first structured extraction of Chinese invoices and reimbursement tickets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["invoice", "fapiao", "vat", "ocr", "china"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "defusedxml>=0.7,<1",
  "pypdf>=5,<8",
  "pypdfium2>=4,<6",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
http = ["httpx>=0.28,<1"]
qwen = ["torch>=2.6,<3", "transformers>=4.57,<5", "accelerate>=1,<2"]
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]
vision = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]
train = ["torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
benchmark = ["httpx>=0.28,<1", "PyYAML>=6,<7"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=7,<8", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/YuqiPlus/CN-Invoice"
Repository = "https://github.com/YuqiPlus/CN-Invoice"
Issues = "https://github.com/YuqiPlus/CN-Invoice/issues"

[project.scripts]
cninvoice = "cninvoice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cninvoice"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/training", "/tools", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
